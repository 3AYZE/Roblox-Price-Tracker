name: Integrate UGC v0.8.4 Fix

on:
  push:
    branches: [ ugc-market-data-v084 ]
    paths:
      - '.github/workflows/integrate-ugc-v084-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ugc-market-data-v084
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Apply patch
        shell: powershell
        run: |
          python tools/patch_v084.py
          python tools/fix_v084_newlines.py
      - name: Validate
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1
      - name: Save verified changes
        shell: powershell
        run: |
          Remove-Item tools/patch_v084.py -Force
          Remove-Item tools/fix_v084_newlines.py -Force
          Remove-Item .github/workflows/integrate-ugc-v084.yml -Force
          Remove-Item .github/workflows/integrate-ugc-v084-fix.yml -Force
          git config user.name Azy
          git config user.email 126979239+3AYZE@users.noreply.github.com
          git add -A
          git commit -m "Use authoritative Roblox UGC market data"
          git push origin HEAD:ugc-market-data-v084
