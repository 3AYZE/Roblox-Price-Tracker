name: Finalize v0.8.4

on:
  push:
    branches: [ ugc-market-data-v084 ]
    paths:
      - '.github/workflows/finalize-v084.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ugc-market-data-v084
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Finalize source and version
        shell: powershell
        run: |
          @'
          from pathlib import Path

          p = Path('src/RobloxPriceTracker.Infrastructure/RobloxUgcDiscoveryService.cs')
          text = p.read_text(encoding='utf-8')
          old = '''            // Preserve the catalog-hydrated candidate if Marketplace Items is temporarily unavailable.
                      // The UI marks this as a catalog fallback instead of pretending it is fully verified.
                      candidates.Add(candidate);'''
          new = '''            // Never surface a sold-out row just because Marketplace Items is temporarily unavailable.
                      // Catalog fallback is allowed only when catalog details still report purchasable stock.
                      if (candidate.UnitsAvailable is > 0)
                          candidates.Add(candidate);
                      else
                          rejectedUnavailable++;'''
          if text.count(old) != 1:
              raise SystemExit(f'fallback guard: expected 1 match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('<Version>0.8.3</Version>', '<Version>0.8.4</Version>'),
              ('<AssemblyVersion>0.8.3.0</AssemblyVersion>', '<AssemblyVersion>0.8.4.0</AssemblyVersion>'),
              ('<FileVersion>0.8.3.0</FileVersion>', '<FileVersion>0.8.4.0</FileVersion>')]:
              if text.count(old) != 1:
                  raise SystemExit(f'version token missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('docs/CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          if '## v0.8.4' not in text:
              entry = '''## v0.8.4
          - Reworked UGC Hunter market data around Roblox's authoritative collectible Marketplace Items API instead of relying on incomplete catalog fields.
          - Primary price, sold count, remaining stock, total stock, current resale floor, reseller availability, and collectible IDs now come from verified Roblox marketplace data when available.
          - Sold-out/unpurchasable items are rejected after authoritative verification and are also blocked from catalog fallback when remaining stock is zero.
          - Hunter uses the modern collectible resale endpoint directly when the collectible ID is already known, reducing stale legacy lookups and unnecessary requests.
          - Reworked Hunter columns and inspector to prioritize real sold/remaining/floor/RAP/resale-volume/break-even data, with model estimates clearly separated.
          - Added frozen regression references from `[ANIMATED] White Heart Aura` (asset `129868485129975`): 1,000 R$ original price, 3,000 sold, 0 remaining, 999 R$ live floor, and a 2,000 R$ reseller break-even.

          '''
              marker = '# Roblox Price Tracker changelog\n\n'
              if marker not in text:
                  raise SystemExit('changelog header missing')
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text, encoding='utf-8')
          '@ | Set-Content finalize_v084.py -Encoding utf8
          python finalize_v084.py
          Remove-Item finalize_v084.py
      - name: Validate full Lite pipeline
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1
      - name: Commit clean v0.8.4 branch
        shell: powershell
        run: |
          git checkout origin/main -- src/RobloxPriceTracker.Gui/Assets
          Remove-Item .github/workflows/finalize-v084.yml -Force
          git config user.name Azy
          git config user.email 126979239+3AYZE@users.noreply.github.com
          git add -A
          git commit -m "Finalize UGC market data v0.8.4"
          git push origin HEAD:ugc-market-data-v084
