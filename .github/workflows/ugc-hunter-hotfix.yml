name: Finalize UGC Hunter Hotfix

on:
  push:
    branches: [ hunter-v071-finalize ]
    paths:
      - '.github/workflows/ugc-hunter-hotfix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hunter-v071-finalize

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Finalize Hunter catalog discovery
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/RobloxPriceTracker.Gui/UgcHunterService.cs')
          text = path.read_text(encoding='utf-8')

          route_start = text.index('    private static readonly string[] SearchEndpoints')
          route_end = text.index('    private const int MaxPagesPerScan', route_start)
          routes = '''    private static readonly string[] SearchEndpoints =
          [
              "https://catalog.roblox.com/v1/search/items/details?Category=11&Subcategory=19&SortType=3&Limit=30",
              "https://catalog.roblox.com/v1/search/items/details?Category=11&SortType=3&Limit=30",
              "https://catalog.roblox.com/v1/search/items/details?Category=1&SortType=3&Limit=30"
          ];
          '''
          text = text[:route_start] + routes + text[route_end:]

          fetch_start = text.index('    private async Task<List<UgcRawCatalogItem>> FetchCandidatesAsync')
          fetch_end = text.index('    private static async Task<string?> ReadResponseDetailAsync', fetch_start)
          finalized_fetch = r'''    private async Task<List<UgcRawCatalogItem>> FetchCandidatesAsync(DateTimeOffset observedAtUtc, CancellationToken cancellationToken)
              {
                  var candidates = new Dictionary<long, UgcRawCatalogItem>();
                  var failures = new List<string>();
                  var anySourceSucceeded = false;

                  foreach (var endpoint in SearchEndpoints)
                  {
                      string? cursor = null;
                      var sourceSucceeded = false;

                      for (var page = 0; page < MaxPagesPerScan; page++)
                      {
                          var url = cursor is null ? endpoint : $"{endpoint}&Cursor={Uri.EscapeDataString(cursor)}";
                          HttpResponseMessage response;
                          try
                          {
                              response = await SendSearchRequestWithRetryAsync(url, cancellationToken).ConfigureAwait(false);
                          }
                          catch (OperationCanceledException)
                          {
                              throw;
                          }
                          catch (Exception ex)
                          {
                              var failure = $"UGC Hunter source request failed on page {page + 1}: {ex.Message}";
                              failures.Add(failure);
                              _logger.Error(failure);
                              break;
                          }

                          using (response)
                          {
                              if (!response.IsSuccessStatusCode)
                              {
                                  var detail = await ReadResponseDetailAsync(response, cancellationToken).ConfigureAwait(false);
                                  var suffix = string.IsNullOrWhiteSpace(detail) ? string.Empty : $" · {detail}";
                                  var failure = $"UGC Hunter source returned HTTP {(int)response.StatusCode} ({response.StatusCode}) on page {page + 1}{suffix}";
                                  failures.Add(failure);
                                  _logger.Error(failure);
                                  break;
                              }

                              await using var stream = await response.Content.ReadAsStreamAsync(cancellationToken).ConfigureAwait(false);
                              JsonDocument document;
                              try
                              {
                                  document = await JsonDocument.ParseAsync(stream, cancellationToken: cancellationToken).ConfigureAwait(false);
                              }
                              catch (JsonException ex)
                              {
                                  var failure = $"UGC Hunter source returned invalid JSON on page {page + 1}: {ex.Message}";
                                  failures.Add(failure);
                                  _logger.Error(failure);
                                  break;
                              }

                              using (document)
                              {
                                  if (!document.RootElement.TryGetProperty("data", out var data) || data.ValueKind != JsonValueKind.Array)
                                  {
                                      var failure = $"UGC Hunter source response did not contain a data array on page {page + 1}.";
                                      failures.Add(failure);
                                      _logger.Error(failure);
                                      break;
                                  }

                                  sourceSucceeded = true;
                                  anySourceSucceeded = true;

                                  foreach (var element in data.EnumerateArray())
                                  {
                                      if (TryParseCandidate(element, observedAtUtc, out var candidate))
                                          candidates[candidate.AssetId] = candidate;
                                  }

                                  cursor = document.RootElement.TryGetProperty("nextPageCursor", out var next) && next.ValueKind == JsonValueKind.String
                                      ? next.GetString()
                                      : null;
                              }
                          }

                          if (string.IsNullOrWhiteSpace(cursor)) break;
                          await Task.Delay(TimeSpan.FromMilliseconds(250), cancellationToken).ConfigureAwait(false);
                      }

                      // Broad fallbacks are used only when the Accessories-first route fails
                      // or yields no qualifying catalog-buyable Limited UGC candidates.
                      if (sourceSucceeded && candidates.Count > 0) break;
                  }

                  if (!anySourceSucceeded)
                  {
                      var detail = failures.Count == 0
                          ? "No Roblox catalog source returned a usable response."
                          : string.Join(" | ", failures.Take(3));
                      throw new HttpRequestException($"Roblox UGC search failed across all supported catalog routes. {detail}");
                  }

                  return candidates.Values.ToList();
              }

              private async Task<HttpResponseMessage> SendSearchRequestWithRetryAsync(string url, CancellationToken cancellationToken)
              {
                  const int maxAttempts = 2;
                  for (var attempt = 0; attempt < maxAttempts; attempt++)
                  {
                      using var request = new HttpRequestMessage(HttpMethod.Get, url);
                      request.Headers.Accept.ParseAdd("application/json");
                      request.Headers.TryAddWithoutValidation("X-Requested-With", "XMLHttpRequest");

                      var response = await _httpClient.SendAsync(request, HttpCompletionOption.ResponseHeadersRead, cancellationToken).ConfigureAwait(false);
                      if (response.StatusCode != System.Net.HttpStatusCode.TooManyRequests || attempt == maxAttempts - 1)
                          return response;

                      var retryAfter = response.Headers.RetryAfter?.Delta ?? TimeSpan.FromMilliseconds(900);
                      var delay = TimeSpan.FromMilliseconds(Math.Clamp(retryAfter.TotalMilliseconds, 500, 5000));
                      response.Dispose();
                      _logger.Info($"UGC Hunter rate limited by Roblox; retrying after {delay.TotalMilliseconds:N0} ms.");
                      await Task.Delay(delay, cancellationToken).ConfigureAwait(false);
                  }

                  throw new InvalidOperationException("UGC Hunter retry loop ended unexpectedly.");
              }

          '''
          text = text[:fetch_start] + finalized_fetch + text[fetch_end:]
          path.write_text(text, encoding='utf-8', newline='\n')

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          old = '- Added supported Roblox catalog fallback routes for Collectibles, Accessories, and broad Marketplace searches; fallbacks are used only when the preferred route fails or finds no qualifying live Limited UGC.'
          new = '- Replaced the failing legacy Collectibles route with Accessories-first Marketplace discovery plus broader fallbacks, bounded 429 retry/backoff, and paced pagination.'
          if old in changelog:
              changelog = changelog.replace(old, new, 1)
          elif new not in changelog:
              raise SystemExit('Expected v0.7.1 changelog line was not found.')
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

      - name: Verify source invariants
        shell: powershell
        run: |
          $hunter = Get-Content 'src/RobloxPriceTracker.Gui/UgcHunterService.cs' -Raw
          if ($hunter -match 'Category=2&Subcategory=2') { throw 'Known-bad Collectibles route still exists.' }
          if ($hunter -notmatch 'Category=11&Subcategory=19&SortType=3&Limit=30') { throw 'Accessories-first route is missing.' }
          if ($hunter -notmatch 'SendSearchRequestWithRetryAsync') { throw '429 retry helper is missing.' }
          if ($hunter -notmatch 'TimeSpan.FromMilliseconds\(250\)') { throw 'Page pacing is missing.' }
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          if ([string]$project.Project.PropertyGroup.Version -ne '0.7.1') { throw 'Application version changed unexpectedly.' }

      - name: Build, run regression tests, and publish single EXE
        shell: powershell
        run: ./tools/Build-Windows.ps1

      - name: Probe Accessories-first route
        shell: powershell
        continue-on-error: true
        run: |
          $urls = @(
            'https://catalog.roblox.com/v1/search/items/details?Category=11&Subcategory=19&SortType=3&Limit=30',
            'https://catalog.roblox.com/v1/search/items/details?Category=11&SortType=3&Limit=30',
            'https://catalog.roblox.com/v1/search/items/details?Category=1&SortType=3&Limit=30'
          )
          foreach ($url in $urls) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Get -Headers @{ 'User-Agent' = 'RobloxPriceTracker/0.7.1'; 'Accept' = 'application/json' } -TimeoutSec 20 -UseBasicParsing
              Write-Host "$($response.StatusCode) $url"
            } catch {
              if ($_.Exception.Response) {
                Write-Warning "$([int]$_.Exception.Response.StatusCode) $url"
              } else {
                Write-Warning "$url -> $($_.Exception.Message)"
              }
            }
            Start-Sleep -Seconds 2
          }

      - name: Commit verified final Hunter hotfix
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/RobloxPriceTracker.Gui/UgcHunterService.cs docs/CHANGELOG.md
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Finalize UGC Hunter catalog routes and backoff'
            git push origin HEAD:hunter-v071-finalize
          } else {
            Write-Host 'No final Hunter changes remained to commit.'
          }
