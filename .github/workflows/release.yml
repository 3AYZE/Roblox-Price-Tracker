name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-single-exe
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish permanent Latest EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build, test and smoke-test EXE
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Publish and validate one EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          $hash = (Get-FileHash 'dist/RobloxPriceTracker.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $title = "Roblox Price Tracker v$version"
          $notes = @'
          **Roblox Price Tracker** monitors Roblox Limited resale prices, discovers qualifying UGC Limiteds and sends price alerts.
          
          **Download:** RobloxPriceTracker.exe — the only file needed for new installations. Future updates are delivered in the app and verified with GitHub's SHA-256 digest.
          
          **Requires:** Windows 10/11 (64-bit) and the .NET 9 Desktop Runtime: https://dotnet.microsoft.com/en-us/download/dotnet/9.0
          
          **Note:** Existing v0.13.8-and-earlier installations can migrate automatically using the retained compatibility release.
          '@
                    gh release view latest --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest 'dist/RobloxPriceTracker.exe#RobloxPriceTracker.exe' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create permanent Latest release.' }
          }
          else {
            gh release upload latest 'dist/RobloxPriceTracker.exe#RobloxPriceTracker.exe' --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace permanent Latest EXE.' }
            gh release edit latest --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not update permanent Latest release.' }
          }
          $released = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published release.' }
          foreach ($asset in @($released.assets | Where-Object { $_.name -ne 'RobloxPriceTracker.exe' })) {
            gh release delete-asset latest $asset.name --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove obsolete asset $($asset.name)." }
          }
          $released = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck Latest release.' }
          $assets = @($released.assets)
          if ($assets.Count -ne 1 -or $assets[0].name -ne 'RobloxPriceTracker.exe' -or $assets[0].digest -ne "sha256:$hash") {
            throw 'Expected exactly one EXE with the correct GitHub SHA-256 digest.'
          }

      - name: Preserve one-time legacy auto-update path
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bridge = 'v0.13.9'
          gh release view $bridge --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          $needsBridge = $LASTEXITCODE -ne 0
          gh release view main-latest --repo $env:GITHUB_REPOSITORY --json body 2>$null | Out-Null
          $oldLatestExists = $LASTEXITCODE -eq 0
          $oldLatestReady = $false
          if ($oldLatestExists) {
            $body = gh release view main-latest --repo $env:GITHUB_REPOSITORY --json body | ConvertFrom-Json
            $oldLatestReady = ([string]$body.body).Contains('ONE_TIME_BRIDGE_v0.13.9')
          }
          if (-not $needsBridge -and $oldLatestReady) { return }
          Copy-Item 'dist/RobloxPriceTracker.exe' 'dist/RobloxPriceTracker-Lite.exe' -Force
          $hash = (Get-FileHash 'dist/RobloxPriceTracker-Lite.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RobloxPriceTracker-Lite.exe" | Set-Content 'dist/RobloxPriceTracker-Lite.exe.sha256' -Encoding ascii -NoNewline
          if ($needsBridge) {
            gh release create $bridge 'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' 'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Roblox Price Tracker v0.13.9 legacy migration' --notes 'One-time old-updater bridge. Download new versions from /releases/tag/latest.' --latest=true
            if ($LASTEXITCODE -ne 0) { throw 'Could not create old Stable-channel bridge.' }
          }
          if (-not $oldLatestReady) {
            if ($oldLatestExists) {
              gh release upload main-latest 'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' 'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Could not replace old Latest-channel files.' }
              gh release edit main-latest --repo $env:GITHUB_REPOSITORY --title 'Roblox Price Tracker legacy Latest-channel migration' --notes 'ONE_TIME_BRIDGE_v0.13.9 - Existing installations migrate to the permanent one-EXE feed.' --prerelease
            }
            else {
              gh release create main-latest 'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' 'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Roblox Price Tracker legacy Latest-channel migration' --notes 'ONE_TIME_BRIDGE_v0.13.9 - Existing installations migrate to the permanent one-EXE feed.' --prerelease
            }
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish old Latest-channel migration bridge.' }
          }
          $legacy = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $legacy.tag_name -ne $bridge) {
            throw 'Old Stable updater must see the numeric bridge through /releases/latest.'
          }
