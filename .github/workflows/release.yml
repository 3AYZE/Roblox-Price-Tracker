name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish versioned release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read application version
        id: version
        shell: powershell
        run: |
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Application Version is missing from the GUI project.' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Application Version '$version' is not a three-part semantic version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          $exists = @($releases | Where-Object { $_.tagName -eq $env:TAG }).Count -gt 0
          if ($exists) {
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; publishing is skipped."
          } else {
            'exists=false' >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG does not exist; verified standalone and Lite builds will be published."
          }

      - name: Build, test, and publish standalone EXE
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: ./tools/Build-Windows.ps1

      - name: Build and smoke-test Lite EXE
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Generate SHA-256 checksums
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: |
          $standalone = Resolve-Path 'dist/RobloxPriceTracker.exe'
          $standaloneHash = (Get-FileHash -LiteralPath $standalone -Algorithm SHA256).Hash.ToLowerInvariant()
          "$standaloneHash  RobloxPriceTracker.exe" | Set-Content -LiteralPath 'dist/RobloxPriceTracker.exe.sha256' -Encoding ascii -NoNewline
          Write-Host "Standalone SHA-256: $standaloneHash"

          $lite = Resolve-Path 'dist/RobloxPriceTracker-Lite.exe'
          $liteHash = (Get-FileHash -LiteralPath $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$liteHash  RobloxPriceTracker-Lite.exe" | Set-Content -LiteralPath 'dist/RobloxPriceTracker-Lite.exe.sha256' -Encoding ascii -NoNewline
          Write-Host "Lite SHA-256: $liteHash"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            'dist/RobloxPriceTracker.exe#RobloxPriceTracker.exe' `
            'dist/RobloxPriceTracker.exe.sha256#RobloxPriceTracker.exe.sha256' `
            'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' `
            'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Roblox Price Tracker v$env:VERSION" `
            --notes "Verified Windows x64 release. RobloxPriceTracker.exe is the self-contained build used by the in-app updater. RobloxPriceTracker-Lite.exe is the much smaller framework-dependent option and requires the .NET 9 Windows Desktop Runtime. Both builds passed startup smoke tests; SHA-256 files are included."
