name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish Lite release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read application version
        id: version
        shell: powershell
        run: |
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Application Version is missing from the GUI project.' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Application Version '$version' is not a three-part semantic version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          $exists = @($releases | Where-Object { $_.tagName -eq $env:TAG }).Count -gt 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Keep existing release Lite-only
        if: steps.existing.outputs.exists == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('RobloxPriceTracker.exe', 'RobloxPriceTracker.exe.sha256')) {
            if ($assetNames -contains $name) {
              gh release delete-asset $env:TAG $name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete release asset $name." }
            }
          }
          gh release edit $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "Roblox Price Tracker v$env:VERSION" `
            --notes "Requires .NET 9 Desktop Runtime (Windows x64): https://dotnet.microsoft.com/en-us/download/dotnet/9.0"

      - name: Restore and build
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: |
          dotnet restore RobloxPriceTracker.sln --ignore-failed-sources
          dotnet build RobloxPriceTracker.sln -c Release --no-restore
          dotnet run --project tests/RobloxPriceTracker.SelfTest/RobloxPriceTracker.SelfTest.csproj -c Release --no-build

      - name: Build and smoke-test Lite EXE
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Generate Lite checksum
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: |
          $lite = Resolve-Path 'dist/RobloxPriceTracker-Lite.exe'
          $hash = (Get-FileHash -LiteralPath $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RobloxPriceTracker-Lite.exe" | Set-Content -LiteralPath 'dist/RobloxPriceTracker-Lite.exe.sha256' -Encoding ascii -NoNewline

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' `
            'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Roblox Price Tracker v$env:VERSION" `
            --notes "Requires .NET 9 Desktop Runtime (Windows x64): https://dotnet.microsoft.com/en-us/download/dotnet/9.0"
