name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-single-exe
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish Roblox Price Tracker EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # README/release copy changes only update metadata, never replace the working EXE.
      # Normal code releases still build, test and validate the EXE.
      - name: Detect metadata-only release update
        id: change_scope
        shell: pwsh
        run: |
          $metadataOnly = $false
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $changed = @(git diff --name-only HEAD^ HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Could not classify release changes.' }
            $metadataPaths = @(
              'README.md',
              '.github/workflows/release.yml',
              '.github/workflows/windows-build.yml',
              'tools/Update-ReleasePresentation.ps1'
            )
            $metadataOnly = $changed.Count -gt 0 -and @($changed | Where-Object { $_ -notin $metadataPaths }).Count -eq 0
          }
          "metadata_only=$($metadataOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release metadata-only: $metadataOnly"

      - uses: actions/setup-dotnet@v4
        if: steps.change_scope.outputs.metadata_only != 'true'
        with:
          dotnet-version: 9.0.x
      - name: Build, test and smoke-test EXE
        if: steps.change_scope.outputs.metadata_only != 'true'
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Publish and validate one EXE
        if: steps.change_scope.outputs.metadata_only != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          $hash = (Get-FileHash 'dist/RobloxPriceTracker.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $title = "Roblox Price Tracker v$version"
          $notes = "Download RobloxPriceTracker.exe for Windows 10/11 (64-bit). Requires .NET 9 Desktop Runtime. See the release description for features."
                    gh release view latest --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest 'dist/RobloxPriceTracker.exe#RobloxPriceTracker.exe' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --latest=true
            if ($LASTEXITCODE -ne 0) { throw 'Could not create permanent Latest release.' }
          }
          else {
            gh release upload latest 'dist/RobloxPriceTracker.exe#RobloxPriceTracker.exe' --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace permanent Latest EXE.' }
            gh release edit latest --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --latest=true
            if ($LASTEXITCODE -ne 0) { throw 'Could not update permanent Latest release.' }
          }
          $released = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published release.' }
          foreach ($asset in @($released.assets | Where-Object { $_.name -ne 'RobloxPriceTracker.exe' })) {
            gh release delete-asset latest $asset.name --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove obsolete asset $($asset.name)." }
          }
          $released = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck Latest release.' }
          $assets = @($released.assets)
          if ($assets.Count -ne 1 -or $assets[0].name -ne 'RobloxPriceTracker.exe' -or $assets[0].digest -ne "sha256:$hash") {
            throw 'Expected exactly one EXE with the correct GitHub SHA-256 digest.'
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP 'roblox-tracker-icon-verification'
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download latest --repo $env:GITHUB_REPOSITORY --pattern 'RobloxPriceTracker.exe' --dir $verifyDir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the released EXE for icon inspection.' }
          & ./tools/Verify-EmbeddedIcon.ps1 -ExecutablePath (Join-Path $verifyDir 'RobloxPriceTracker.exe') -IconPath 'src/RobloxPriceTracker.Gui/Assets/mouse_app.ico'

      - name: Update current release title and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Update-ReleasePresentation.ps1
