name: Integrate UGC Resale Intelligence v0.8.0

on:
  push:
    branches: [ ugc-resale-intelligence-v080 ]
    paths:
      - '.github/workflows/ugc-resale-v080.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ugc-resale-intelligence-v080
          fetch-depth: 0

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Integrate resale intelligence
        shell: python
        run: |
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          # ---- Hunter service ----
          path = Path('src/RobloxPriceTracker.Gui/UgcHunterService.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    private const int MaxPagesPerScan = 3;\n    private readonly HttpClient _httpClient;\n    private readonly RobloxThumbnailService _thumbnailService;\n    private readonly AppLogger _logger;',
              '    private const int MaxPagesPerScan = 3;\n    private const int ResaleEnrichmentLimit = 8;\n    private readonly HttpClient _httpClient;\n    private readonly RobloxThumbnailService _thumbnailService;\n    private readonly RobloxResaleDataService _resaleDataService;\n    private readonly RobloxResellerDataService _resellerDataService;\n    private readonly AppLogger _logger;',
              1)

          old_ctor = '''    public UgcHunterService(HttpClient httpClient, RobloxThumbnailService thumbnailService, AppLogger logger, string dataDirectory)
              {
                  _httpClient = httpClient;
                  _thumbnailService = thumbnailService;
                  _logger = logger;
                  _historyPath = Path.Combine(dataDirectory, "ugc-hunter-history.json");
              }'''
          # Normalize exact source indentation rather than depending on the display wrapping above.
          old_ctor = old_ctor.replace('              ', '    ')
          new_ctor = '''    public UgcHunterService(
              HttpClient httpClient,
              RobloxThumbnailService thumbnailService,
              RobloxResaleDataService resaleDataService,
              RobloxResellerDataService resellerDataService,
              AppLogger logger,
              string dataDirectory)
          {
              _httpClient = httpClient;
              _thumbnailService = thumbnailService;
              _resaleDataService = resaleDataService;
              _resellerDataService = resellerDataService;
              _logger = logger;
              _historyPath = Path.Combine(dataDirectory, "ugc-hunter-history.json");
          }'''
          new_ctor = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_ctor.splitlines())
          if old_ctor not in text:
              # use boundaries if formatting differs
              cstart = text.index('    public UgcHunterService(')
              cend = text.index('    public async Task InitializeAsync', cstart)
              text = text[:cstart] + new_ctor.rstrip() + '\n\n' + text[cend:]
          else:
              text = text.replace(old_ctor, new_ctor, 1)

          refresh = r'''    public async Task<UgcHunterMarketSnapshot> RefreshAsync(CancellationToken cancellationToken = default)
          {
              await InitializeAsync(cancellationToken).ConfigureAwait(false);
              var now = DateTimeOffset.UtcNow;
              var raw = await FetchCandidatesAsync(now, cancellationToken).ConfigureAwait(false);

              IReadOnlyDictionary<long, string> thumbnails;
              try
              {
                  thumbnails = await _thumbnailService.GetAssetThumbnailUrlsAsync(raw.Select(x => x.AssetId), cancellationToken).ConfigureAwait(false);
              }
              catch (Exception ex)
              {
                  _logger.Error($"UGC Hunter thumbnails could not be loaded: {ex.Message}");
                  thumbnails = new Dictionary<long, string>();
              }

              var analyzed = new List<UgcHunterItem>(raw.Count);
              await _gate.WaitAsync(cancellationToken).ConfigureAwait(false);
              try
              {
                  foreach (var candidate in raw)
                  {
                      if (!_history.TryGetValue(candidate.AssetId, out var observations))
                      {
                          observations = new List<UgcHunterObservation>();
                          _history[candidate.AssetId] = observations;
                      }

                      var observation = new UgcHunterObservation(
                          candidate.AssetId,
                          candidate.PurchaseCount,
                          candidate.UnitsAvailable,
                          candidate.Price,
                          candidate.FavoriteCount,
                          now);

                      if (observations.Count == 0 || now - observations[^1].ObservedAtUtc >= TimeSpan.FromSeconds(20))
                          observations.Add(observation);
                      else
                          observations[^1] = observation;

                      observations.RemoveAll(x => now - x.ObservedAtUtc > TimeSpan.FromHours(24));
                      if (observations.Count > 360) observations.RemoveRange(0, observations.Count - 360);

                      thumbnails.TryGetValue(candidate.AssetId, out var thumbnail);
                      analyzed.Add(Analyze(candidate, observations, thumbnail));
                  }

                  await PersistLockedAsync(cancellationToken).ConfigureAwait(false);
              }
              finally
              {
                  _gate.Release();
              }

              analyzed = (await EnrichResaleEvidenceAsync(analyzed, cancellationToken).ConfigureAwait(false))
                  .OrderByDescending(x => x.ResalePotentialScore)
                  .ThenByDescending(x => x.EntryScore)
                  .ThenBy(x => x.SelloutEta ?? TimeSpan.MaxValue)
                  .ToList();

              var market = BuildMarketState(analyzed);
              return new UgcHunterMarketSnapshot(analyzed, market, now);
          }

          private async Task<IReadOnlyList<UgcHunterItem>> EnrichResaleEvidenceAsync(
              IReadOnlyList<UgcHunterItem> baseline,
              CancellationToken cancellationToken)
          {
              if (baseline.Count == 0) return baseline;

              var selected = baseline
                  .OrderByDescending(x => x.ResalePotentialScore)
                  .ThenByDescending(x => x.EntryScore)
                  .Take(ResaleEnrichmentLimit)
                  .ToArray();

              var tasks = selected.Select(async item =>
              {
                  try
                  {
                      var market = await _resaleDataService.GetAsync(item.AssetId, cancellationToken).ConfigureAwait(false);
                      RobloxResellerMarketData? book = null;
                      if (!string.IsNullOrWhiteSpace(market.CollectibleItemId))
                      {
                          book = await _resellerDataService.GetAsync(item.AssetId, market.CollectibleItemId, cancellationToken).ConfigureAwait(false);
                      }
                      return ApplyResaleEvidence(item, market, book);
                  }
                  catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)
                  {
                      throw;
                  }
                  catch (Exception ex)
                  {
                      _logger.Error($"UGC Hunter resale enrichment failed for asset {item.AssetId}: {ex.Message}");
                      return item;
                  }
              });

              var enriched = await Task.WhenAll(tasks).ConfigureAwait(false);
              var byId = enriched.ToDictionary(x => x.AssetId);
              return baseline.Select(x => byId.TryGetValue(x.AssetId, out var replacement) ? replacement : x).ToArray();
          }'''
          refresh = '\n'.join(line[10:] if line.startswith('          ') else line for line in refresh.splitlines())
          text = replace_between(text, '    public async Task<UgcHunterMarketSnapshot> RefreshAsync', '    private async Task<List<UgcRawCatalogItem>> FetchCandidatesAsync', refresh)

          analyze = r'''    private static UgcHunterItem Analyze(UgcRawCatalogItem item, IReadOnlyList<UgcHunterObservation> history, string? thumbnail)
          {
              var now = item.ObservedAtUtc;
              var velocity1 = Velocity(history, TimeSpan.FromMinutes(1));
              var velocity5 = Velocity(history, TimeSpan.FromMinutes(5));
              var velocity15 = Velocity(history, TimeSpan.FromMinutes(15));
              var bestVelocity = velocity1 > 0 ? velocity1 : velocity5 > 0 ? velocity5 : velocity15;
              var acceleration = velocity5 > 0 && velocity1 > 0
                  ? Math.Clamp((velocity1 - velocity5) / velocity5, -2.0, 4.0)
                  : 0.0;

              long? totalSupply = item.TotalQuantity is > 0
                  ? item.TotalQuantity
                  : item.UnitsAvailable is { } remaining
                      ? Math.Max(1, item.PurchaseCount + remaining)
                      : null;
              var remainingPct = totalSupply is { } supply && item.UnitsAvailable is { } left
                  ? Math.Clamp((double)left / supply, 0d, 1d)
                  : (double?)null;
              var absorptionPerHour = totalSupply is { } supply2 && bestVelocity > 0
                  ? bestVelocity * 60.0 / supply2
                  : 0d;

              var score = UgcResaleScoring.Evaluate(new UgcResaleScoringInput(
                  item.Price,
                  totalSupply,
                  item.PurchaseCount,
                  item.UnitsAvailable,
                  bestVelocity,
                  acceleration,
                  item.FavoriteCount,
                  history.Count));

              var entry = CalculateEntryScore(score, remainingPct, acceleration);
              var velocityLabel = bestVelocity <= 0.01 ? "CALIBRATING"
                  : acceleration >= 0.25 ? "ACCELERATING"
                  : acceleration <= -0.45 ? "COOLING FAST"
                  : acceleration <= -0.15 ? "COOLING"
                  : "SUSTAINED";
              var phase = remainingPct switch
              {
                  >= 0.80 => "JUST DROPPED",
                  >= 0.55 => acceleration >= 0.15 ? "LAUNCH SURGE" : "EARLY MARKET",
                  >= 0.25 => acceleration < -0.2 ? "SLOWING" : "SUSTAINED DEMAND",
                  > 0 => "SCARCITY PHASE",
                  0 => "SOLD OUT",
                  null => history.Count < 3 ? "DISCOVERED" : "LIVE",
                  _ => "LIVE"
              };
              TimeSpan? eta = item.UnitsAvailable is { } unitsLeft && bestVelocity > 0.01
                  ? TimeSpan.FromMinutes(unitsLeft / bestVelocity)
                  : null;
              if (eta > TimeSpan.FromDays(7)) eta = null;

              var entryWindow = score.Recommendation == "AVOID" ? "AVOID"
                  : entry >= 82 ? "STRONG"
                  : entry >= 65 ? "OPEN"
                  : entry >= 45 ? "CLOSING"
                  : "LATE";

              return new UgcHunterItem(
                  item.AssetId,
                  item.Name,
                  item.CreatorName,
                  item.CreatorId,
                  item.Category,
                  thumbnail,
                  item.Price,
                  item.PurchaseCount,
                  item.UnitsAvailable,
                  totalSupply,
                  item.FavoriteCount,
                  velocity1,
                  velocity5,
                  velocity15,
                  acceleration,
                  absorptionPerHour,
                  score.ResalePotential,
                  entry,
                  score.RiskScore,
                  score.Confidence,
                  phase,
                  velocityLabel,
                  entryWindow,
                  eta,
                  ToIntPrice(score.BearResale),
                  ToIntPrice(score.BaseResale),
                  ToIntPrice(score.BullResale),
                  score.Reasons,
                  score.Risks,
                  now)
              {
                  ResalePotentialScore = score.ResalePotential,
                  LiquidityScore = score.LiquidityScore,
                  ProfitabilityScore = score.ProfitabilityScore,
                  ProjectedNetRoi = score.BaseNetRoi,
                  BreakEvenResalePrice = score.BreakEvenResale,
                  LiquidityLabel = score.LiquidityLabel,
                  Recommendation = score.Recommendation,
                  ObservationCount = history.Count
              };
          }

          private static UgcHunterItem ApplyResaleEvidence(
              UgcHunterItem item,
              RobloxResaleMarketData market,
              RobloxResellerMarketData? book)
          {
              var hasMarket = market.IsAvailable || book is { IsAvailable: true };
              var sales30 = SalesLast30d(market);
              var score = UgcResaleScoring.Evaluate(new UgcResaleScoringInput(
                  item.Price,
                  item.TotalSupply,
                  item.PurchaseCount,
                  item.UnitsAvailable,
                  item.VelocityPerMinute,
                  item.Acceleration,
                  item.FavoriteCount,
                  item.ObservationCount,
                  market.RecentAveragePrice,
                  book?.LowestPrice,
                  book?.ObservedListings ?? 0,
                  book?.HasMoreListings ?? false,
                  book?.ListingsWithin10Pct ?? 0,
                  book?.ListingsWithin20Pct ?? 0,
                  market.SalesLast7d,
                  sales30,
                  book?.MedianTop10,
                  hasMarket));

              var remainingPct = item.TotalSupply is { } supply && item.UnitsAvailable is { } left
                  ? Math.Clamp((double)left / supply, 0d, 1d)
                  : (double?)null;
              var entry = CalculateEntryScore(score, remainingPct, item.Acceleration);
              var entryWindow = score.Recommendation == "AVOID" ? "AVOID"
                  : entry >= 82 ? "STRONG"
                  : entry >= 65 ? "OPEN"
                  : entry >= 45 ? "CLOSING"
                  : "LATE";

              return item with
              {
                  OpportunityScore = score.ResalePotential,
                  EntryScore = entry,
                  RiskScore = score.RiskScore,
                  Confidence = score.Confidence,
                  EntryWindow = entryWindow,
                  BearValue = ToIntPrice(score.BearResale),
                  BaseValue = ToIntPrice(score.BaseResale),
                  BullValue = ToIntPrice(score.BullResale),
                  Reasons = score.Reasons,
                  Risks = score.Risks,
                  CollectibleItemId = market.CollectibleItemId,
                  ResalePotentialScore = score.ResalePotential,
                  LiquidityScore = score.LiquidityScore,
                  ProfitabilityScore = score.ProfitabilityScore,
                  ProjectedNetRoi = score.BaseNetRoi,
                  BreakEvenResalePrice = score.BreakEvenResale,
                  CurrentResaleFloor = book?.LowestPrice,
                  RecentAveragePrice = market.RecentAveragePrice,
                  ObservedResellers = book?.ObservedListings ?? 0,
                  ResellerBookTruncated = book?.HasMoreListings ?? false,
                  SalesLast7d = market.SalesLast7d,
                  SalesLast30d = sales30,
                  LiquidityLabel = score.LiquidityLabel,
                  Recommendation = score.Recommendation,
                  HasLiveResaleMarket = hasMarket
              };
          }

          private static double CalculateEntryScore(UgcResaleScore score, double? remainingPct, double acceleration)
          {
              double timing = remainingPct switch
              {
                  >= 0.75 => 45d,
                  >= 0.50 => 55d,
                  >= 0.30 => 66d,
                  >= 0.15 => 78d,
                  >= 0.05 => 90d,
                  > 0 => 96d,
                  0 => 20d,
                  null => 58d,
                  _ => 58d
              };
              var entry = ClampScore(score.ResalePotential * 0.60d + timing * 0.25d + score.DemandScore * 0.15d);
              if (score.Recommendation == "AVOID") entry = Math.Min(entry, 30d);
              if (acceleration < -0.45d) entry = ClampScore(entry - 16d);
              return entry;
          }

          private static double SalesLast30d(RobloxResaleMarketData market)
          {
              var valid = market.VolumeDataPoints.Where(x => x.Value >= 0).OrderByDescending(x => x.Date).ToArray();
              if (valid.Length == 0) return 0d;
              var newest = valid[0].Date;
              return valid.Where(x => x.Date >= newest - TimeSpan.FromDays(30.5)).Sum(x => x.Value);
          }

          private static int ToIntPrice(long value) => (int)Math.Clamp(value, 1L, int.MaxValue);'''
          analyze = '\n'.join(line[10:] if line.startswith('          ') else line for line in analyze.splitlines())
          text = replace_between(text, '    private static UgcHunterItem Analyze(', '    private static double Velocity(', analyze)

          market_state = r'''    private static UgcMarketState BuildMarketState(IReadOnlyList<UgcHunterItem> items)
          {
              if (items.Count == 0) return new UgcMarketState("QUIET", 0, 0, 0, "No qualifying buyable UGC Limiteds found in the current scan.");
              var avgResale = items.Average(x => x.ResalePotentialScore);
              var avgVelocity = items.Average(x => x.VelocityPerMinute);
              var strong = items.Count(x => x.ResalePotentialScore >= 75 && x.EntryScore >= 55 && x.Recommendation != "AVOID");
              var regime = avgResale >= 76 || strong >= 5 ? "VERY HOT"
                  : avgResale >= 66 || strong >= 3 ? "HOT"
                  : avgResale >= 54 ? "NORMAL"
                  : avgResale >= 42 ? "COOLING"
                  : "WEAK";
              var detail = $"{strong} high-resale drop{(strong == 1 ? string.Empty : "s")} · avg resale {avgResale:0} · avg velocity {avgVelocity:0.0}/m";
              return new UgcMarketState(regime, items.Count, strong, avgResale, detail);
          }'''
          market_state = '\n'.join(line[10:] if line.startswith('          ') else line for line in market_state.splitlines())
          text = replace_between(text, '    private static UgcMarketState BuildMarketState(', '    private async Task PersistLockedAsync', market_state)

          property_marker = '    public string RobloxUrl => $"https://www.roblox.com/catalog/{AssetId}";\n}'
          properties = '''    public string RobloxUrl => $"https://www.roblox.com/catalog/{AssetId}";
              public string? CollectibleItemId { get; init; }
              public double ResalePotentialScore { get; init; }
              public double LiquidityScore { get; init; }
              public double ProfitabilityScore { get; init; }
              public double ProjectedNetRoi { get; init; }
              public long BreakEvenResalePrice { get; init; }
              public long? CurrentResaleFloor { get; init; }
              public double? RecentAveragePrice { get; init; }
              public int ObservedResellers { get; init; }
              public bool ResellerBookTruncated { get; init; }
              public double SalesLast7d { get; init; }
              public double SalesLast30d { get; init; }
              public string LiquidityLabel { get; init; } = "MODELED";
              public string Recommendation { get; init; } = "WATCH";
              public bool HasLiveResaleMarket { get; init; }
              public int ObservationCount { get; init; }
              public string ResalePotentialText => ResalePotentialScore.ToString("0");
              public string NetRoiText => $"{ProjectedNetRoi:+0%;-0%;0%}";
              public string BreakEvenText => BreakEvenResalePrice > 0 ? $"{BreakEvenResalePrice:N0} R$" : "—";
              public string CurrentResaleText => CurrentResaleFloor is > 0 ? $"{CurrentResaleFloor:N0} R$" : "—";
              public string RapText => RecentAveragePrice is > 0 ? $"{RecentAveragePrice.Value:N0} R$" : "—";
              public string ResellersText => ObservedResellers <= 0 ? "—" : ResellerBookTruncated ? $"{ObservedResellers:N0}+" : $"{ObservedResellers:N0}";
              public string SalesText => HasLiveResaleMarket ? $"{SalesLast7d:0.#}/7d · {SalesLast30d:0.#}/30d" : "MODELED";
              public string LiquidityText => $"{LiquidityLabel} · {LiquidityScore:0}";
          }'''
          properties = '\n'.join(line[10:] if line.startswith('          ') else line for line in properties.splitlines())
          if property_marker not in text:
              raise SystemExit('UgcHunterItem property marker not found')
          text = text.replace(property_marker, properties, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # ---- App services ----
          path = Path('src/RobloxPriceTracker.Gui/AppServices.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        RobloxResaleDataService resaleDataService,\n        PriceForecastEngine forecastEngine,',
              '        RobloxResaleDataService resaleDataService,\n        RobloxResellerDataService resellerDataService,\n        PriceForecastEngine forecastEngine,', 1)
          text = text.replace(
              '        ResaleDataService = resaleDataService;\n        ForecastEngine = forecastEngine;',
              '        ResaleDataService = resaleDataService;\n        ResellerDataService = resellerDataService;\n        ForecastEngine = forecastEngine;', 1)
          text = text.replace(
              '    public RobloxResaleDataService ResaleDataService { get; }\n    public PriceForecastEngine ForecastEngine { get; }',
              '    public RobloxResaleDataService ResaleDataService { get; }\n    public RobloxResellerDataService ResellerDataService { get; }\n    public PriceForecastEngine ForecastEngine { get; }', 1)
          text = text.replace(
              '        var resaleDataService = new RobloxResaleDataService(httpClient, logger);\n        var forecastEngine = new PriceForecastEngine();',
              '        var resaleDataService = new RobloxResaleDataService(httpClient, logger);\n        var resellerDataService = new RobloxResellerDataService(httpClient, logger);\n        var forecastEngine = new PriceForecastEngine();', 1)
          text = text.replace(
              '        var ugcHunterService = new UgcHunterService(httpClient, thumbnailService, logger, dataDir);',
              '        var ugcHunterService = new UgcHunterService(httpClient, thumbnailService, resaleDataService, resellerDataService, logger, dataDir);', 1)
          text = text.replace(
              '            updateService,\n            resaleDataService,\n            forecastEngine,',
              '            updateService,\n            resaleDataService,\n            resellerDataService,\n            forecastEngine,', 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # ---- Hunter UI ----
          path = Path('src/RobloxPriceTracker.Gui/MainWindow.TerminalUi.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    private TextBlock? _hunterInspectorForecast;\n    private TextBlock? _hunterInspectorReasons;',
              '    private TextBlock? _hunterInspectorForecast;\n    private TextBlock? _hunterInspectorBreakEven;\n    private TextBlock? _hunterInspectorLiveResale;\n    private TextBlock? _hunterInspectorNetRoi;\n    private TextBlock? _hunterInspectorLiquidity;\n    private TextBlock? _hunterInspectorReasons;', 1)
          text = text.replace('foreach (var item in new[] { "All scores", "70+ potential", "80+ potential", "90+ potential" })',
                              'foreach (var item in new[] { "All resale", "70+ resale", "80+ resale", "90+ resale" })', 1)
          text = text.replace('_hunterInspectorOpportunity = AddScore(scoreGrid, 0, "OPPORTUNITY", "—", TerminalGreen);',
                              '_hunterInspectorOpportunity = AddScore(scoreGrid, 0, "RESALE", "—", TerminalGreen);', 1)
          old_outlook = '''        _hunterInspectorForecast = new TextBlock { Text = "—", Foreground = TerminalText, FontSize = 14, FontWeight = FontWeights.SemiBold, Margin = new Thickness(0, 8, 0, 0) };
                  stack.Children.Add(_hunterInspectorForecast);
                  stack.Children.Add(new TextBlock { Text = "Statistical scenario range, not a guaranteed resale price.", Foreground = TerminalMuted, FontSize = 8, Margin = new Thickness(0, 4, 0, 0), TextWrapping = TextWrapping.Wrap });'''
          old_outlook = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_outlook.splitlines())
          new_outlook = '''        _hunterInspectorForecast = new TextBlock { Text = "—", Foreground = TerminalText, FontSize = 14, FontWeight = FontWeights.SemiBold, Margin = new Thickness(0, 8, 0, 0) };
                  stack.Children.Add(_hunterInspectorForecast);
                  _hunterInspectorBreakEven = AddInspectorMetric(stack, "Break-even resale", "—");
                  _hunterInspectorLiveResale = AddInspectorMetric(stack, "Live floor / RAP", "—");
                  _hunterInspectorNetRoi = AddInspectorMetric(stack, "Base net ROI", "—");
                  _hunterInspectorLiquidity = AddInspectorMetric(stack, "Liquidity", "—");
                  stack.Children.Add(new TextBlock { Text = "Bear/base/bull are gross resale scenarios. Net ROI applies the 50% community-Limited reseller share; scenarios are estimates, not guaranteed prices.", Foreground = TerminalMuted, FontSize = 8, Margin = new Thickness(0, 6, 0, 0), TextWrapping = TextWrapping.Wrap });'''
          new_outlook = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_outlook.splitlines())
          if old_outlook not in text:
              raise SystemExit('Hunter resale outlook UI block not found')
          text = text.replace(old_outlook, new_outlook, 1)

          columns = r'''    private void AddHunterColumns(DataGrid grid)
          {
              grid.Columns.Add(CreateHunterAssetColumn());
              grid.Columns.Add(HunterTextColumn("PRICE", nameof(UgcHunterItem.PriceText), 0.66, TerminalText, true));
              grid.Columns.Add(HunterTextColumn("LEFT", nameof(UgcHunterItem.RemainingText), 0.84, TerminalMuted));
              grid.Columns.Add(HunterTextColumn("ETA", nameof(UgcHunterItem.EtaText), 0.58, TerminalAmber));
              grid.Columns.Add(HunterTextColumn("RESALE", nameof(UgcHunterItem.ResalePotentialText), 0.62, TerminalGreen, true));
              grid.Columns.Add(HunterTextColumn("NET ROI", nameof(UgcHunterItem.NetRoiText), 0.70, TerminalText, true));
              grid.Columns.Add(HunterTextColumn("LIQ", nameof(UgcHunterItem.LiquidityText), 0.82, TerminalBlue));
              grid.Columns.Add(HunterTextColumn("RISK", nameof(UgcHunterItem.RiskText), 0.55, TerminalRed, true));
              grid.Columns.Add(HunterTextColumn("PHASE", nameof(UgcHunterItem.Phase), 1.03, TerminalMuted));
          }'''
          columns = '\n'.join(line[10:] if line.startswith('          ') else line for line in columns.splitlines())
          text = replace_between(text, '    private void AddHunterColumns(DataGrid grid)', '    private void AddPortfolioColumns(DataGrid grid)', columns)
          text = text.replace('        return row.OpportunityScore >= minimum;', '        return row.ResalePotentialScore >= minimum;', 1)

          old_inspector = '''        if (_hunterInspectorPhase is not null)
                  {
                      _hunterInspectorPhase.Text = $"{item.Phase}  ·  ENTRY {item.EntryWindow}";
                      _hunterInspectorPhase.Foreground = item.EntryScore >= 75 ? TerminalGreen : item.EntryScore >= 50 ? TerminalAmber : TerminalRed;
                  }
                  if (_hunterInspectorOpportunity is not null) _hunterInspectorOpportunity.Text = item.OpportunityText;'''
          old_inspector = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_inspector.splitlines())
          new_inspector = '''        if (_hunterInspectorPhase is not null)
                  {
                      _hunterInspectorPhase.Text = $"{item.Recommendation}  ·  {item.Phase}  ·  ENTRY {item.EntryWindow}";
                      _hunterInspectorPhase.Foreground = item.Recommendation switch
                      {
                          "HIGH RESALE" or "STRONG" => TerminalGreen,
                          "WATCH" or "SPECULATIVE" => TerminalAmber,
                          _ => TerminalRed
                      };
                  }
                  if (_hunterInspectorOpportunity is not null) _hunterInspectorOpportunity.Text = item.ResalePotentialText;'''
          new_inspector = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_inspector.splitlines())
          if old_inspector not in text:
              raise SystemExit('Hunter inspector phase block not found')
          text = text.replace(old_inspector, new_inspector, 1)
          text = text.replace(
              '        if (_hunterInspectorForecast is not null) _hunterInspectorForecast.Text = $"{item.ForecastText}  ·  BASE {item.BaseValueText}";\n        if (_hunterInspectorReasons is not null)',
              '        if (_hunterInspectorForecast is not null) _hunterInspectorForecast.Text = $"{item.ForecastText}  ·  BASE {item.BaseValueText}";\n        if (_hunterInspectorBreakEven is not null) _hunterInspectorBreakEven.Text = item.BreakEvenText;\n        if (_hunterInspectorLiveResale is not null) _hunterInspectorLiveResale.Text = $"{item.CurrentResaleText} / {item.RapText}";\n        if (_hunterInspectorNetRoi is not null) _hunterInspectorNetRoi.Text = item.NetRoiText;\n        if (_hunterInspectorLiquidity is not null) _hunterInspectorLiquidity.Text = $"{item.LiquidityText} · {item.SalesText} · sellers {item.ResellersText}";\n        if (_hunterInspectorReasons is not null)', 1)

          text = text.replace('metrics.Children.Add(MakeSmallLabel("MARKET VALUE"));', 'metrics.Children.Add(MakeSmallLabel("NET PROCEEDS"));', 1)
          text = text.replace('Hunter entry snapshots · actual resale floor when available', 'Hunter snapshots · net P/L applies the 50% reseller share', 1)

          # Portfolio summary uses expected reseller proceeds, not gross listing floor.
          old_summary = r'''    private void UpdatePortfolioSummary()
          {
              var positions = _paperRows.Select(x => x.Position).ToArray();
              var cost = positions.Sum(x => x.EntryPrice * x.Quantity);
              var priced = positions.Where(x => x.CurrentFloor is > 0).ToArray();
              var value = priced.Sum(x => x.CurrentFloor!.Value * x.Quantity);
              var pricedCost = priced.Sum(x => x.EntryPrice * x.Quantity);
              var pnl = value - pricedCost;
              var wins = priced.Count(x => x.CurrentFloor!.Value > x.EntryPrice);

              if (_portfolioCostText is not null) _portfolioCostText.Text = $"{cost:N0} R$";
              if (_portfolioValueText is not null) _portfolioValueText.Text = priced.Length > 0 ? $"{value:N0} R$" : "—";
              if (_portfolioPnlText is not null)
              {
                  _portfolioPnlText.Text = priced.Length > 0 ? $"{pnl:+#,##0;-#,##0;0} R$" : "—";
                  _portfolioPnlText.Foreground = priced.Length == 0 ? TerminalMuted : pnl >= 0 ? TerminalGreen : TerminalRed;
              }
              if (_portfolioWinRateText is not null)
              {
                  _portfolioWinRateText.Text = priced.Length > 0 ? $"{(double)wins / priced.Length:P0}" : "—";
                  _portfolioWinRateText.Foreground = priced.Length == 0 ? TerminalMuted : wins * 2 >= priced.Length ? TerminalGreen : TerminalAmber;
              }
          }'''
          old_summary = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_summary.splitlines())
          new_summary = r'''    private void UpdatePortfolioSummary()
          {
              var positions = _paperRows.Select(x => x.Position).ToArray();
              var cost = positions.Sum(x => x.EntryPrice * x.Quantity);
              var priced = positions.Where(x => x.CurrentFloor is > 0).ToArray();
              var proceeds = priced.Sum(x => x.CurrentFloor!.Value * UgcResaleScoring.CommunityLimitedResellerShare * x.Quantity);
              var pricedCost = priced.Sum(x => x.EntryPrice * x.Quantity);
              var pnl = proceeds - pricedCost;
              var wins = priced.Count(x => x.CurrentFloor!.Value * UgcResaleScoring.CommunityLimitedResellerShare > x.EntryPrice);

              if (_portfolioCostText is not null) _portfolioCostText.Text = $"{cost:N0} R$";
              if (_portfolioValueText is not null) _portfolioValueText.Text = priced.Length > 0 ? $"{proceeds:N0} R$" : "—";
              if (_portfolioPnlText is not null)
              {
                  _portfolioPnlText.Text = priced.Length > 0 ? $"{pnl:+#,##0;-#,##0;0} R$" : "—";
                  _portfolioPnlText.Foreground = priced.Length == 0 ? TerminalMuted : pnl >= 0 ? TerminalGreen : TerminalRed;
              }
              if (_portfolioWinRateText is not null)
              {
                  _portfolioWinRateText.Text = priced.Length > 0 ? $"{(double)wins / priced.Length:P0}" : "—";
                  _portfolioWinRateText.Foreground = priced.Length == 0 ? TerminalMuted : wins * 2 >= priced.Length ? TerminalGreen : TerminalAmber;
              }
          }'''
          new_summary = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_summary.splitlines())
          if old_summary not in text:
              raise SystemExit('Portfolio summary block not found')
          text = text.replace(old_summary, new_summary, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # ---- Paper portfolio row economics ----
          path = Path('src/RobloxPriceTracker.Gui/PaperPortfolioStore.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    public string Value => Position.CurrentFloor is > 0 ? $"{Position.CurrentFloor.Value * Position.Quantity:N0} R$" : "—";',
              '    public string Value => Position.CurrentFloor is > 0 ? $"{Position.CurrentFloor.Value * UgcResaleScoring.CommunityLimitedResellerShare * Position.Quantity:N0} R$" : "—";', 1)
          text = text.replace(
              '            var delta = (Position.CurrentFloor.Value - Position.EntryPrice) * Position.Quantity;',
              '            var delta = (Position.CurrentFloor.Value * UgcResaleScoring.CommunityLimitedResellerShare - Position.EntryPrice) * Position.Quantity;', 1)
          text = text.replace(
              '            var roi = (double)(Position.CurrentFloor.Value - Position.EntryPrice) / Position.EntryPrice;',
              '            var roi = (Position.CurrentFloor.Value * UgcResaleScoring.CommunityLimitedResellerShare - Position.EntryPrice) / Position.EntryPrice;', 1)
          text = text.replace(
              '        : Position.CurrentFloor.Value >= Position.EntryPrice ? TerminalBrushes.Green : TerminalBrushes.Red;',
              '        : Position.CurrentFloor.Value * UgcResaleScoring.CommunityLimitedResellerShare >= Position.EntryPrice ? TerminalBrushes.Green : TerminalBrushes.Red;', 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # ---- Tests ----
          path = Path('tests/RobloxPriceTracker.SelfTest/Program.Main.cs')
          text = path.read_text(encoding='utf-8')
          needle = '            ("Forecast backtest store evaluates next quote", TestForecastBacktestStoreAsync)'
          replacement = '''            ("Forecast backtest store evaluates next quote", TestForecastBacktestStoreAsync),
              ("UGC resale break-even applies reseller share", TestUgcResaleBreakEvenAsync),
              ("Fast expensive sellout is not automatic buy", TestUgcFastExpensiveSelloutIsNotAutomaticBuyAsync),
              ("Profitable liquid UGC market ranks high", TestUgcProfitableLiquidMarketRanksHighAsync),
              ("Unprofitable live UGC resale is hard-gated", TestUgcUnprofitableLiveResaleHardGateAsync),
              ("UGC reseller book parser reads depth", TestUgcResellerBookParserAsync)'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          if needle not in text:
              raise SystemExit('Program.Main test marker not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # ---- Version and changelog ----
          path = Path('src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<Version>0.7.1</Version>', '<Version>0.8.0</Version>', 1)
          text = text.replace('<AssemblyVersion>0.7.1.0</AssemblyVersion>', '<AssemblyVersion>0.8.0.0</AssemblyVersion>', 1)
          text = text.replace('<FileVersion>0.7.1.0</FileVersion>', '<FileVersion>0.8.0.0</FileVersion>', 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '# Roblox Price Tracker changelog\n\n'
          entry = '''## v0.8.0
              - Rebuilt UGC Hunter around **resale potential** instead of treating fast sellout as the primary opportunity signal.
              - Added the current 50% community-Limited reseller share to break-even, bear/base/bull net ROI, recommendation gates, and Paper Portfolio P/L.
              - Added modern collectible reseller-book sampling with floor, top-listing median, floor depth, observed seller count, and truncated-book awareness.
              - Hunter enriches only the strongest modeled candidates with cached Roblox resale aggregates and reseller depth to keep API traffic bounded.
              - Added resale liquidity scoring from recent sales versus competing listings, plus floor/RAP/book stability checks that reject thin or unrealistic markets.
              - Recalibrated paid UGC scarcity for the practical 1–3,000 supply range so ordinary paid Limiteds no longer receive near-max scarcity automatically.
              - Added profitability hard gates: fast-selling expensive items cannot rank highly when the projected resale does not clear break-even or produces weak net ROI.
              - Reworked late-stage entry timing so a genuinely strong near-sellout item can remain actionable instead of being automatically punished for low remaining supply.
              - Expanded Hunter with Resale, Net ROI, Liquidity, break-even, live floor/RAP, reseller count, recent resale volume, and explicit HIGH RESALE / STRONG / WATCH / SPECULATIVE / AVOID recommendations.
              - Corrected Paper Portfolio market value, P/L, ROI, win rate, and coloring to use estimated net reseller proceeds rather than gross listing price.
              - Added five resale-intelligence regression tests covering break-even, expensive sellout gating, profitable/liquid ranking, unprofitable live-market rejection, and reseller-book parsing.

              '''
          entry = '\n'.join(line[14:] if line.startswith('              ') else line for line in entry.splitlines())
          if marker not in text:
              raise SystemExit('Changelog header not found')
          if '## v0.8.0' not in text:
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify source invariants
        shell: powershell
        run: |
          $hunter = Get-Content 'src/RobloxPriceTracker.Gui/UgcHunterService.cs' -Raw
          if ($hunter -notmatch 'ResaleEnrichmentLimit = 8') { throw 'Bounded Hunter resale enrichment is missing.' }
          if ($hunter -notmatch 'UgcResaleScoring.Evaluate') { throw 'Hunter is not using resale scoring.' }
          if ($hunter -notmatch 'ResalePotentialScore') { throw 'Hunter resale potential fields are missing.' }
          $paper = Get-Content 'src/RobloxPriceTracker.Gui/PaperPortfolioStore.cs' -Raw
          if ($paper -notmatch 'CommunityLimitedResellerShare') { throw 'Paper portfolio still uses gross floor economics.' }
          $ui = Get-Content 'src/RobloxPriceTracker.Gui/MainWindow.TerminalUi.cs' -Raw
          if ($ui -notmatch 'Break-even resale') { throw 'Hunter resale inspector is missing.' }
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          if ([string]$project.Project.PropertyGroup.Version -ne '0.8.0') { throw 'Application version is not 0.8.0.' }

      - name: Build, run regression tests, and publish single EXE
        shell: powershell
        run: ./tools/Build-Windows.ps1

      - name: Commit verified integration
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs/CHANGELOG.md
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Upgrade UGC Hunter resale intelligence to v0.8.0'
            git push origin HEAD:ugc-resale-intelligence-v080
          } else {
            Write-Host 'No integration changes remained to commit.'
          }
