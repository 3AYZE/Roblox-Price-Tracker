name: Run UGC Resale v0.8.0 Integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-ugc-resale-v080-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ugc-resale-intelligence-v080
          fetch-depth: 0

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Execute branch integration patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/ugc-resale-v080.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == '- name: Integrate resale intelligence')
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].strip() == '- name: Verify source invariants')
          code_lines = workflow[run_line + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code_lines)
          exec(compile(code, 'ugc-resale-v080-integration.py', 'exec'), {})

      - name: Verify source invariants
        shell: powershell
        run: |
          $hunter = Get-Content 'src/RobloxPriceTracker.Gui/UgcHunterService.cs' -Raw
          if ($hunter -notmatch 'ResaleEnrichmentLimit = 8') { throw 'Bounded Hunter resale enrichment is missing.' }
          if ($hunter -notmatch 'UgcResaleScoring.Evaluate') { throw 'Hunter is not using resale scoring.' }
          if ($hunter -notmatch 'ResalePotentialScore') { throw 'Hunter resale potential fields are missing.' }
          $paper = Get-Content 'src/RobloxPriceTracker.Gui/PaperPortfolioStore.cs' -Raw
          if ($paper -notmatch 'CommunityLimitedResellerShare') { throw 'Paper portfolio still uses gross floor economics.' }
          $ui = Get-Content 'src/RobloxPriceTracker.Gui/MainWindow.TerminalUi.cs' -Raw
          if ($ui -notmatch 'Break-even resale') { throw 'Hunter resale inspector is missing.' }
          [xml]$project = Get-Content 'src/RobloxPriceTracker.Gui/RobloxPriceTracker.Gui.csproj'
          if ([string]$project.Project.PropertyGroup.Version -ne '0.8.0') { throw 'Application version is not 0.8.0.' }

      - name: Build, run regression tests, and publish single EXE
        shell: powershell
        run: ./tools/Build-Windows.ps1

      - name: Commit verified integration to feature branch
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs/CHANGELOG.md
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Upgrade UGC Hunter resale intelligence to v0.8.0'
            git push origin HEAD:ugc-resale-intelligence-v080
          } else {
            Write-Host 'No integration changes remained to commit.'
          }
