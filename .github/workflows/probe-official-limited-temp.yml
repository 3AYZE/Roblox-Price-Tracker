name: Probe Official Limited API

on:
  push:
    branches:
      - fix-official-limited-startup-v0101
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Roblox catalog feeds
        shell: python
        run: |
          import json, urllib.request, urllib.parse

          queries = [
              "Category=2&CreatorTargetId=1&CreatorType=User&SortType=2&SortAggregation=3&Limit=30",
              "Category=2&CreatorTargetId=1&CreatorType=User&SortType=2&SortAggregation=5&Limit=30",
              "Category=1&salesTypeFilter=2&CreatorTargetId=1&CreatorType=User&SortType=2&SortAggregation=5&Limit=30",
              "Category=1&salesTypeFilter=2&SortType=2&SortAggregation=5&Limit=30",
              "Category=11&CreatorTargetId=1&CreatorType=User&SortType=1&SortAggregation=5&Limit=30",
          ]

          for i, q in enumerate(queries, 1):
              url = "https://catalog.roblox.com/v1/search/items/details?" + q
              req = urllib.request.Request(url, headers={"User-Agent": "RPT-Probe/1.0", "Accept": "application/json"})
              print(f"\n=== FEED {i} ===")
              print(url)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      data = json.loads(raw)
                  rows = data.get("data") or []
                  official = []
                  limited = []
                  for row in rows:
                      restrictions = row.get("itemRestrictions") or []
                      is_limited = any(x in ("Limited", "LimitedUnique", "Collectible") for x in restrictions)
                      if is_limited:
                          limited.append(row)
                      if row.get("creatorTargetId") == 1 and str(row.get("creatorType", "")).lower() == "user" and is_limited:
                          official.append(row)
                  print("http=200 rows=", len(rows), "limited=", len(limited), "official_limited=", len(official), "next=", bool(data.get("nextPageCursor")))
                  for row in rows[:8]:
                      print(json.dumps({
                          "id": row.get("id"),
                          "name": row.get("name"),
                          "creatorTargetId": row.get("creatorTargetId"),
                          "creatorType": row.get("creatorType"),
                          "creatorName": row.get("creatorName"),
                          "restrictions": row.get("itemRestrictions"),
                          "lowestPrice": row.get("lowestPrice"),
                          "price": row.get("price"),
                      }, ensure_ascii=False))
              except Exception as e:
                  print("ERROR", repr(e))
