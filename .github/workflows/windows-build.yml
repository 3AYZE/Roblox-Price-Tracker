name: Windows Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate release presentation PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/Update-ReleasePresentation.ps1').Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Release presentation script has syntax errors.'
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build, test and smoke-test EXE
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1
      - name: Upload verified Windows Lite EXE
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPriceTracker-Windows-Lite-${{ github.run_number }}
          path: dist/RobloxPriceTracker.exe
          if-no-files-found: error
          retention-days: 14
