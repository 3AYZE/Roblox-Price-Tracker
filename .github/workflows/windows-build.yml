name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish Lite
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build, test, and smoke-test Lite EXE
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Upload Lite build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPriceTracker-Lite-win-x64
          path: dist/RobloxPriceTracker-Lite.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPriceTracker-build-log
          path: logs/build-lite.log
          if-no-files-found: ignore
          retention-days: 14
