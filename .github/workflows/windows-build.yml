name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test, and smoke-test Lite
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build, test, and smoke-test Lite EXE
        shell: powershell
        run: ./tools/Build-Windows-Lite.ps1

      - name: Generate Latest checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $lite = Resolve-Path 'dist/RobloxPriceTracker-Lite.exe'
          $hash = (Get-FileHash -LiteralPath $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RobloxPriceTracker-Lite.exe" | Set-Content -LiteralPath 'dist/RobloxPriceTracker-Lite.exe.sha256' -Encoding ascii -NoNewline

      - name: Publish verified Latest main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'main-latest'

          # Deleting a non-existent release is expected on the very first publish.
          # Suppress that one native-command error, then let release creation remain strict.
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes 2>$null
          $ErrorActionPreference = $previousPreference

          $short = $env:GITHUB_SHA.Substring(0, 7)
          gh release create $tag `
            'dist/RobloxPriceTracker-Lite.exe#RobloxPriceTracker-Lite.exe' `
            'dist/RobloxPriceTracker-Lite.exe.sha256#RobloxPriceTracker-Lite.exe.sha256' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "Roblox Market Helper Latest · $short" `
            --notes "Automatic Latest/Development channel build from main. Published only after the Windows build, regression tests, and Lite startup smoke test pass. Stable users remain on normal versioned GitHub Releases."
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the Latest main build.' }
