name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Probe live Roblox UGC catalog routes
        shell: powershell
        run: |
          $urls = @(
            'https://catalog.roblox.com/v1/search/items/details?Category=1&salesTypeFilter=2&SortType=3&Limit=30',
            'https://catalog.roblox.com/v1/search/items/details?Category=11&Subcategory=19&salesTypeFilter=2&SortType=3&Limit=30',
            'https://catalog.roblox.com/v1/search/items/details?Category=2&SortType=3&Limit=30',
            'https://catalog.roblox.com/v1/search/items/details?Category=13&salesTypeFilter=2&SortType=3&Limit=30'
          )
          foreach ($url in $urls) {
            Write-Host "=== $url ==="
            try {
              $response = Invoke-WebRequest -Uri $url -Headers @{ 'User-Agent' = 'RobloxPriceTracker/0.8.1'; Accept = 'application/json' } -TimeoutSec 20 -UseBasicParsing
              Write-Host "HTTP $($response.StatusCode)"
              $json = $response.Content | ConvertFrom-Json
              $rows = @($json.data)
              $limited = @($rows | Where-Object { @($_.itemRestrictions) -contains 'Collectible' -or @($_.itemRestrictions) -contains 'Limited' -or @($_.itemRestrictions) -contains 'LimitedUnique' })
              Write-Host "Rows=$($rows.Count) Limited=$($limited.Count)"
              $limited | Select-Object -First 5 id,name,assetType,price,unitsAvailableForConsumption,purchaseCount,saleLocationType,itemRestrictions | ConvertTo-Json -Depth 5 -Compress | Write-Host
            }
            catch {
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'n/a' }
              Write-Host "FAILED HTTP $status :: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }

      - name: Build, run regression tests, and publish single EXE
        shell: powershell
        run: ./tools/Build-Windows.ps1

      - name: Upload RobloxPriceTracker.exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPriceTracker-win-x64
          path: dist/RobloxPriceTracker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPriceTracker-build-log
          path: logs/build.log
          if-no-files-found: ignore
          retention-days: 14
